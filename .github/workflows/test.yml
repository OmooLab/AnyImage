name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Build node assets
        run: uv run --group blender node-group build --skip-tests

      - name: Run tests
        run: uv run --group blender pytest tests/anyimage tests/nodes tests/tools
