name: Release

on:
  push:
    tags:
      # 版本标签触发草稿 Release，例如 v1.0.1
      - "v*"

permissions:
  contents: write

jobs:
  check_version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check tag matches project version
        id: read_version
        run: |
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build_extensions:
    name: Build Extensions
    needs: check_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Pack extensions
        run: uv run pack

      - name: Run tests
        run: uv run --group blender pytest tests/anyimage tests/nodes tests/tools -k "not BLENDER_EEVEE_NEXT"

      - name: Check extension archives
        run: uv run --group blender python -m tools.validate_extensions

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archives=()
          for platform in windows-x64 macos-arm64 linux-x64; do
            for name in "AnyImage" "AnyImage_Base"; do
              archives+=("dist/${name}.v${{ needs.check_version.outputs.version }}.${platform}.zip")
            done
          done
          gh release create "$GITHUB_REF_NAME" "${archives[@]}" --draft --verify-tag --generate-notes
