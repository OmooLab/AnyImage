schema_version = "1.0.0"

id = "anyimage"
version = "1.1.6"
name = "AnyImage"
tagline = "Build spatial structures from images, fast"
maintainer = "OmooLab"
type = "add-on"

blender_version_min = "4.5.0"
platforms = ["windows-x64"]
wheels = ["./wheels/blendjob-0.1.24-py3-none-any.whl", "./wheels/materialyoucolor-3.0.4-cp311-cp311-win_amd64.whl", "./wheels/materialyoucolor-3.0.4-cp313-cp313-win_amd64.whl", "./wheels/pillow-12.1.1-cp311-cp311-win_amd64.whl", "./wheels/pillow-12.1.1-cp313-cp313-win_amd64.whl", "./wheels/scipy-1.17.1-cp311-cp311-win_amd64.whl", "./wheels/scipy-1.17.1-cp313-cp313-win_amd64.whl"]
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Connect to the AI Server and download dependencies and models"
files = "Read source and clipboard images, and store environment data"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.blend[0-9]*",
  "*.zip",
]
