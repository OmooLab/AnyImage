site_name: AnyImage Docs
site_url: https://docs.omoolab.xyz/anyimage/
site_author: OmooLab
site_description: Image editing tools for Blender — paste, crop, combine, match colors, and use AI when you need it.

repo_name: OmooLab/AnyImage
repo_url: https://github.com/OmooLab/AnyImage

exclude_docs: |
  includes/

nav:
  - 开始使用:
      - index.md
      - 安装: installation.md
      - 立体裁切: cutout.md
      - 整图转为网格: convert-to.md
      - 烘焙网格: bake-mesh.md
      - 图片工具: image-tools.md
      - 色彩匹配: color-match.md
      - AI 小工具: ai-image-tools.md
  - 开发文档:
      - 总览: develop/index.md
      - 程序架构: develop/architecture.md
      - 公共函数: develop/common.md
      - 基础设施:
          - Job Runtime 与 Server: develop/runtime.md
          - Job 产物: develop/outputs.md
      - Operators:
          - 总览: develop/operators/index.md
          - AI 环境管理: develop/operators/ai-setup.md
          - 粘贴剪贴板图像: develop/operators/clipboard-image.md
          - 转为面片: develop/operators/convert-to-plane.md
          - 转为立体全景: develop/operators/convert-to-panorama.md
          - 立体裁切: develop/operators/cutout-tool.md
          - 重设画框: develop/operators/frame.md
          - 局部显隐: develop/operators/mask.md
          - 透视校正: develop/operators/rectify.md
          - 色彩匹配: develop/operators/color-match.md
          - 烘焙网格: develop/operators/bake-mesh.md
          - Job 文件清理: develop/operators/job-files.md
          - 移除背景: develop/operators/remove-background.md
          - 2倍高清: develop/operators/upscale.md
      - 开发维护:
          - 开发与发布: develop/development.md
          - 节点资产: develop/node-assets.md

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/logo.png
  language: zh
  font:
    text: Open Sans
    code: Cascadia Code
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: black
      toggle:
        icon: fontawesome/solid/circle-half-stroke
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: fontawesome/regular/moon
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: fontawesome/solid/moon
        name: Switch to system preference

  features:
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.code.select

extra:
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css
  
extra_javascript:
  - javascripts/extra.js

copyright: Copyright &copy; 2020 - 2024 Omoolab

plugins:
  - search
  - mkdocstrings
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          name: 中文
          default: true
        - locale: en
          name: English
          nav_translations:
            开始使用: Getting Started
            安装: Installation
            立体裁切: Cutout
            整图转为网格: Convert Images to Meshes
            烘焙网格: Bake Mesh
            图片工具: Image Tools
            色彩匹配: Color Match
            快捷键: Keymap
            AI 小工具: AI tools

markdown_extensions:
  - mkdocs-click
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
